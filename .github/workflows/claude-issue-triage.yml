name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

# Varias ediciones seguidas no deben pisarse al escribir el mismo comentario
concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # necesario para aplicar labels y comentar
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude issue triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Permite procesar issues de gente sin permiso de escritura en el repo
          allowed_non_write_users: '*'
          prompt: >-
            /triage-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}
            El comentario que publiques en el issue debe estar escrito en formato Markdown
            compatible con GitHub (GitHub Flavored Markdown): usa encabezados, listas,
            bloques de código con su lenguaje, tablas y enlaces para que GitHub lo renderice
            correctamente.
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*)"
